name: Validate Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate documentation
        run: python3 scripts/validate_docs.py
